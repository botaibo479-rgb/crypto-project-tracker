services:
  reader:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      SIGNAL_BIND: 0.0.0.0
      SIGNAL_PUBLIC_ORIGIN: https://${SIGNAL_DOMAIN:?Set SIGNAL_DOMAIN}
      OPENNEWS_TOKEN: ${OPENNEWS_TOKEN:?Set OPENNEWS_TOKEN}
    volumes:
      - reader-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      reader:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      SIGNAL_DOMAIN: ${SIGNAL_DOMAIN:?Set SIGNAL_DOMAIN}
      SIGNAL_LOGIN: ${SIGNAL_LOGIN:?Set SIGNAL_LOGIN}
      SIGNAL_PASSWORD_HASH: ${SIGNAL_PASSWORD_HASH:?Set SIGNAL_PASSWORD_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  reader-data:
  caddy-data:
  caddy-config:
